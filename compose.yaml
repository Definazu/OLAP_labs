name: olap-course

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.12
    container_name: olap_clickhouse
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: '1'
    ports:
      - '127.0.0.1:8123:8123'
      - '127.0.0.1:9000:9000'
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: [CMD, clickhouse-client, --query, 'SELECT 1']
      interval: 5s
      timeout: 3s
      retries: 20

  metabase:
    image: metabase/metabase:v0.56.7
    environment:
      MB_DB_FILE: /metabase-data/olap.db
      MB_ANON_TRACKING_ENABLED: 'false'
      MB_CHECK_FOR_UPDATES: 'false'
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  clickhouse_data:
  metabase_data:
